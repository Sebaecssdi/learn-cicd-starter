name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Run tests
        run: go test -cover ./...

      - name: Build the app
        run: ./scripts/buildprod.sh
